# Cross-compilation wiring (see README — "Cross-compiling from Linux").
#
# Links the msvc target with LLVM's lld-link, which pairs with the Windows
# SDK/CRT headers+libs splatted by the standalone `xwin` binary into
# ~/.cache/cargo-xwin/xwin/splat (or %LOCALAPPDATA%\cargo-xwin\xwin\splat
# on Windows). No extra flags are needed once lld-link + llvm-rc are on
# PATH.
#
# NOTE: we intentionally do NOT set `runner = "cargo-xwin"`. In sandboxes
# with a ~10min per-tool-call timeout, `cargo xwin build` re-splats the
# SDK from scratch on every invocation because the splat step never
# finishes within the timeout, so the DONE marker is never written. The
# standalone `xwin splat` is run once up front (see scripts/cross_compile_flatui.sh)
# and plain `cargo build` is used instead — same result, no re-splat loop.
# Native Windows builds use the MSVC linker (link.exe) that ships with
# Visual Studio / Build Tools — rustc auto-detects it via vswhere, so no
# override is needed. The lld-link override below is only relevant when
# cross-compiling from Linux with cargo-xwin, and breaks native builds
# when LLVM isn't installed, so it's commented out here.
#
# To restore Linux cross-compilation, uncomment the two lines below and
# make sure `lld-link` (from an LLVM distribution) is on PATH:
#
# [target.x86_64-pc-windows-msvc]
# linker = "lld-link"
