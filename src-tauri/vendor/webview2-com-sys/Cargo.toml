# FlatUI-patched copy of webview2-com-sys 0.38.2 — see src/lib.rs and build.rs
# for the raw-dylib changes. The original Cargo.toml.orig is preserved
# alongside this file for reference.

[package]
edition = "2021"
rust-version = "1.74"
name = "webview2-com-sys"
version = "0.38.2"
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bindings generated with the windows crate for the WebView2 COM APIs (FlatUI-patched: raw-dylib, no static lib)"
readme = "README.md"
keywords = ["win32", "webview2"]
categories = ["os::windows-apis"]
license = "MIT"
repository = "https://github.com/wravery/webview2-rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = [
    "i686-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "i686-pc-windows-gnu",
]

[lib]
name = "webview2_com_sys"
path = "src/lib.rs"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.61"
