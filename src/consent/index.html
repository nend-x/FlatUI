<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlatUI — Elevation Request</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: rgba(36, 26, 17, 0.97);
      background-image: var(--grain-image);
      background-size: var(--grain-size);
      background-position: var(--grain-position);
      background-repeat: var(--grain-repeat);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-ui);
      user-select: none;
    }
    .consent-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: rgba(36, 26, 17, 0.94);
      background-image: var(--grain-image);
      background-size: var(--grain-size);
      background-position: var(--grain-position);
      background-repeat: var(--grain-repeat);
      border: 1px solid rgba(194, 178, 128, 0.22);
      border-radius: 14px;
      padding: 32px 40px 28px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
      max-width: 380px;
      text-align: center;
    }
    .consent-shield {
      width: 48px;
      height: 48px;
      color: var(--accent-terracotta);
      opacity: 0.85;
    }
    .consent-title {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--sand-cream);
      letter-spacing: 0.06em;
      font-weight: 500;
      line-height: 1.4;
    }
    .consent-body {
      font-size: 13px;
      color: var(--sand);
      line-height: 1.6;
      letter-spacing: 0.01em;
    }
    .consent-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }
    .consent-btn {
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 9px 24px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background-color 160ms var(--ease-out-soft),
                  border-color 160ms var(--ease-out-soft),
                  transform 120ms var(--ease-spring);
    }
    .consent-btn:hover {
      transform: scale(1.04);
    }
    .consent-btn:active {
      transform: scale(1.0);
    }
    .consent-btn.primary {
      background: var(--accent-terracotta);
      color: #fff;
      border-color: var(--accent-terracotta);
    }
    .consent-btn.primary:hover {
      background: #c46a4a;
    }
    .consent-btn.secondary {
      background: transparent;
      color: var(--sand-dim);
    }
    .consent-btn.secondary:hover {
      color: var(--sand-cream);
      border-color: var(--border-strong);
    }
  </style>
</head>
<body>
  <div class="consent-card">
    <svg class="consent-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l9 4v6c0 5.5-3.5 10-9 12-5.5-2-9-6.5-9-12V6l9-4z"/>
    </svg>
    <div class="consent-title">FlatUI needs administrative privileges to work properly</div>
    <div class="consent-body">
      Elevated rights let the Win-key block intercept input for all windows, including apps running as administrator. Without elevation, the Start menu may open when an elevated app has focus.
    </div>
    <div class="consent-actions">
      <button class="consent-btn secondary" id="consent-no">No thanks</button>
      <button class="consent-btn primary" id="consent-yes">Proceed</button>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
