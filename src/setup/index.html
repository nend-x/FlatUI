<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlatUI Setup</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(61, 44, 30, 0.96);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .setup-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      /* Solid card panel — refined opacity, layered shadow for depth */
      background: rgba(28, 20, 14, 0.94);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 26px 44px 30px;
      box-shadow:
        0 14px 44px rgba(0, 0, 0, 0.5),
        0 1px 2px rgba(0, 0, 0, 0.3);
      animation: setup-pop-in 540ms var(--ease-spring-soft);
    }
    @keyframes setup-pop-in {
      0%   { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .setup-logo {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--sand-cream);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .setup-status {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--sand);
      letter-spacing: 0.04em;
      transition: opacity var(--dur-medium) var(--ease-out-soft);
    }
    .setup-status.fading { opacity: 0; }
    .setup-bar {
      width: 200px;
      height: 2px;
      background: rgba(184, 167, 124, 0.10);
      border-radius: 1px;
      overflow: hidden;
    }
    .setup-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-amber);
      border-radius: 1px;
      transition: width var(--dur-slow) var(--ease-out-quint);
      box-shadow: 0 0 4px rgba(217, 168, 120, 0.35);
    }
    body.exiting {
      animation: fade-out 440ms var(--ease-out-quint) forwards;
    }
    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.96); }
    }
  </style>
</head>
<body>
  <div class="setup-content">
    <div class="setup-logo">FlatUI</div>
    <div class="setup-status" id="setup-status">Welcome</div>
    <div class="setup-bar"><div class="setup-bar-fill" id="setup-bar-fill"></div></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
