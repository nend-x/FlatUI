<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlatUI Setup</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(14, 16, 20, 0.96);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .setup-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--bg-mist-deep);
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-xl);
      padding: 28px 48px 32px;
      box-shadow: var(--shadow-overlay);
      animation: hush-pop-in 220ms var(--ease-out-quart);
    }
    .setup-logo {
      font-family: var(--font-ui);
      font-size: 18px;
      font-weight: 600;
      color: var(--snow);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .setup-status {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--smoke);
      letter-spacing: 0.02em;
      transition: opacity 280ms var(--ease-out-quart);
    }
    .setup-status.fading { opacity: 0; }
    .setup-bar {
      width: 200px;
      height: 2px;
      background: var(--hairline-strong);
      border-radius: 1px;
      overflow: hidden;
    }
    .setup-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 560ms var(--ease-out-quart);
    }
    body.exiting {
      animation: hush-setup-exit 560ms var(--ease-out-quart) forwards;
    }
    @keyframes hush-setup-exit {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.97); }
    }
  </style>
</head>
<body>
  <div class="setup-content">
    <div class="setup-logo">Hush</div>
    <div class="setup-status" id="setup-status">Welcome</div>
    <div class="setup-bar"><div class="setup-bar-fill" id="setup-bar-fill"></div></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
