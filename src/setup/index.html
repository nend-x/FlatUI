<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hush_UI Setup</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgba(var(--bg-espresso-rgb), 0.97);
      background-image: var(--grain-image);
      background-size: var(--grain-size);
      background-position: var(--grain-position);
      background-repeat: var(--grain-repeat);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .setup-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      /* Solid card panel so the text always has a readable background,
         even when the window itself is transparent and the desktop behind
         it is light/busy. */
      background-color: rgba(var(--bg-espresso-deep-rgb), 0.94);
      background-image: var(--grain-image);
      background-size: var(--grain-size);
      background-position: var(--grain-position);
      background-repeat: var(--grain-repeat);
      border: 1px solid rgba(var(--sand-rgb), 0.22);
      border-radius: 14px;
      padding: 26px 44px 30px;
      box-shadow: var(--shadow-card);
    }
    .setup-logo {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--text-primary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .setup-status {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      transition: opacity 300ms var(--ease-out-soft);
    }
    .setup-status.fading { opacity: 0; }
    .setup-warning {
      display: none;
      max-width: 300px;
      font-family: var(--font-ui);
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--accent-terracotta, #B8835A);
      background: rgba(var(--accent-terracotta-rgb, 184, 131, 90), 0.12);
      border: 1px solid rgba(var(--accent-terracotta-rgb, 184, 131, 90), 0.35);
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
    }
    .setup-warning.visible { display: block; }
    .setup-bar {
      width: 200px;
      height: 3px;
      background: rgba(var(--sand-rgb), 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .setup-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-terracotta);
      border-radius: 2px;
      transition: width 600ms var(--ease-out-expo);
    }
    body.exiting {
      animation: fade-out 600ms var(--ease-out-expo) forwards;
    }
    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="setup-content">
    <div class="setup-logo">Hush_UI</div>
    <div class="setup-status" id="setup-status">Welcome</div>
    <div class="setup-bar"><div class="setup-bar-fill" id="setup-bar-fill"></div></div>
    <div class="setup-warning" id="setup-warning">
      Not running as administrator — screen dimming might not work on system apps.
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
